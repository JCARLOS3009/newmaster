<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilha Orçamentária — Volque 22395E</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ... (mesmo CSS anterior, sem alterações) ... */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #e8ff47;
    --accent2: #47b3ff;
    --text: #e4e8f5;
    --text-muted: #6b738f;
    --text-dim: #3d4460;
    --cat-colors: #e8ff47, #47ffb3, #ff6b47, #c847ff, #47b3ff, #ffb347, #ff4792, #47ffd4, #b3ff47, #ff4747, #47a0ff, #ffd447, #a047ff, #47ffff, #ff8a47;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
    height: 64px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: -0.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .logo span { color: var(--text-muted); font-weight: 400; font-size: 13px; display: block; margin-top: -2px; }

  .search-wrap {
    flex: 1;
    position: relative;
    max-width: 560px;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px 10px 42px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #search::placeholder { color: var(--text-dim); }

  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,255,71,0.08);
  }

  .search-count {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
  }

  .header-stats {
    display: flex;
    gap: 20px;
    flex-shrink: 0;
    margin-left: auto;
  }

  .stat {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.2;
  }

  .stat strong {
    display: block;
    font-size: 18px;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
  }

  .layout {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    min-height: calc(100vh - 64px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .sidebar-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    padding: 0 20px 12px;
    text-transform: uppercase;
  }

  .cat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 20px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
    position: relative;
  }

  .cat-btn:hover { background: var(--surface); }

  .cat-btn.active {
    background: var(--surface2);
  }

  .cat-btn.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent);
  }

  .cat-btn .icon { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }

  .cat-btn .label {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }

  .cat-btn .badge {
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    flex-shrink: 0;
  }

  .cat-btn.active .label { color: var(--accent); }

  .main { padding: 28px 32px; overflow-y: auto; }

  .cat-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .cat-header-icon {
    font-size: 40px;
    line-height: 1;
    flex-shrink: 0;
  }

  .cat-header-text h1 {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
  }

  .cat-header-text .meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .subcat {
    margin-bottom: 24px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: opacity 0.2s;
  }

  .subcat.hidden { display: none; }

  .subcat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    cursor: pointer;
    user-select: none;
    gap: 12px;
  }

  .subcat-head:hover { background: var(--surface2); }

  .subcat-code {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    flex-shrink: 0;
    width: 56px;
  }

  .subcat-name {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
  }

  .subcat-toggle {
    font-size: 14px;
    color: var(--text-dim);
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .subcat.open .subcat-toggle { transform: rotate(180deg); }

  .items-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    display: none;
  }

  .subcat.open .items-table { display: table; }

  .items-table thead th {
    padding: 8px 16px;
    text-align: left;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--surface2);
    border-top: 1px solid var(--border);
    font-weight: 400;
  }

  .items-table thead th:nth-child(3),
  .items-table thead th:nth-child(4),
  .items-table thead th:nth-child(5),
  .items-table thead th:nth-child(6) { text-align: right; }

  .items-table tbody tr {
    border-top: 1px solid var(--border);
    transition: background 0.1s;
  }

  .items-table tbody tr:hover { background: var(--surface); }
  .items-table tbody tr.highlight { background: rgba(232,255,71,0.06); }

  .items-table td {
    padding: 10px 16px;
    vertical-align: top;
    color: var(--text);
    line-height: 1.4;
  }

  .items-table td:first-child {
    color: var(--text-dim);
    font-size: 10px;
    white-space: nowrap;
    width: 30px;
    text-align: center;
  }

  .items-table td:nth-child(2) {
    color: var(--text-dim);
    font-size: 10px;
    white-space: nowrap;
    width: 140px;
  }

  .items-table td:nth-child(3) { color: var(--text); max-width: 440px; }

  .items-table td:nth-child(4) {
    color: var(--accent2);
    text-align: right;
    white-space: nowrap;
    font-size: 11px;
    width: 50px;
  }

  .items-table td:nth-child(5) {
    text-align: right;
    white-space: nowrap;
    width: 100px;
    color: var(--text-muted);
  }

  .items-table td:nth-child(6) {
    text-align: right;
    white-space: nowrap;
    width: 110px;
    color: var(--accent);
    font-weight: 500;
  }

  mark {
    background: rgba(232,255,71,0.25);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 1px;
  }

  .all-view-header {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 24px;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }

  .empty .e-icon { font-size: 48px; margin-bottom: 16px; }
  .empty h2 { font-family: 'Syne', sans-serif; font-size: 20px; margin-bottom: 8px; }
  .empty p { font-size: 13px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .fmt-brl::before { content: 'R$ '; font-size: 10px; color: var(--text-dim); }

  .export-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 7px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.3px;
  }

  .export-btn:hover { opacity: 0.88; }
  .export-btn:active { transform: scale(0.97); }

  .export-btn.loading {
    opacity: 0.6;
    pointer-events: none;
  }

  .export-btn svg { flex-shrink: 0; }

  .selection-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-muted);
  }

  .selection-bar button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .selection-bar button:hover { background: var(--border); }

  .selection-bar .sel-count { color: var(--accent); font-weight: 700; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: relative; top: 0; height: auto; border-right: none; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; padding: 12px; gap: 6px; }
    .cat-btn { width: auto; border-radius: 6px; border: 1px solid var(--border); padding: 6px 12px; }
    .cat-btn .icon { width: auto; }
    .cat-btn.active::before { display: none; }
    .cat-btn.active { background: var(--surface2); border-color: var(--accent); }
    .sidebar-label { width: 100%; }
    .header-stats { display: none; }
    .main { padding: 16px; }
    .selection-bar { margin-left: 0; }
  }
  /* Modal de prévia */
#previewModal {
  display: none;
}
#previewModal table th {
  background: var(--surface2);
  color: var(--accent);
  font-weight: 700;
  padding: 6px 10px;
  text-align: left;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 2;
}
#previewModal table td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
#previewModal table tr:nth-child(even) td {
  background: var(--surface);
}
#previewModal table .cat-row td {
  background: #141720;
  color: var(--accent);
  font-weight: 700;
}
#previewModal table .subcat-row td {
  background: #1c2030;
  color: #6b738f;
  font-weight: 600;
}
</style>
</head>

// ==================== VARIÁVEIS GLOBAIS ====================
let currentCat = null;
let searchQuery = '';
let selectedItems = new Set(); // conjunto de códigos de itens selecionados

// Count total items
let totalItems = 0;
DATA.forEach(c => c.subcats.forEach(sc => totalItems += sc.items.length));
document.getElementById('stat-items').textContent = totalItems.toLocaleString('pt-BR');

function fmtBRL(v) {
  if (!v && v !== 0) return '—';
  return v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function highlight(text, query) {
  if (!query) return escHtml(text);
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ==================== ATUALIZA CONTADOR DE SELECIONADOS ====================
function updateSelectedCount() {
  document.getElementById('selected-count').textContent = selectedItems.size;
}

function clearSelection() {
  selectedItems.clear();
  updateSelectedCount();
  renderMain(); // re-renderiza para atualizar checkboxes
}

// ==================== CONSTRÓI SIDEBAR ====================
const sidebar = document.getElementById('sidebar');
const allBtn = document.createElement('button');
allBtn.className = 'cat-btn active';
allBtn.dataset.id = '__all__';
allBtn.innerHTML = `<span class="icon">📊</span><span class="label">Todos os itens</span><span class="badge">${totalItems}</span>`;
allBtn.onclick = () => selectCat(null);
sidebar.appendChild(allBtn);

DATA.forEach(cat => {
  const itemCount = cat.subcats.reduce((a,sc) => a + sc.items.length, 0);
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.dataset.id = cat.id;
  btn.innerHTML = `<span class="icon">${cat.icon}</span><span class="label">${escHtml(cat.name)}</span><span class="badge">${itemCount}</span>`;
  btn.onclick = () => selectCat(cat.id);
  sidebar.appendChild(btn);
});

function selectCat(id) {
  currentCat = id;
  searchQuery = '';
  document.getElementById('search').value = '';
  document.getElementById('search-count').textContent = '';
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === (id || '__all__'));
  });
  renderMain();
}

// ==================== RENDERIZAÇÃO PRINCIPAL ====================
function renderMain() {
  const main = document.getElementById('main');
  const q = searchQuery.toLowerCase().trim();

  if (currentCat === null) {
    // Todos os itens
    main.innerHTML = '';
    let totalVisible = 0;

    DATA.forEach(cat => {
      const catItems = cat.subcats.flatMap(sc => sc.items.filter(item =>
        !q || item.code.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.unit.toLowerCase().includes(q)
      ));
      if (catItems.length === 0 && q) return;

      const itemCount = cat.subcats.reduce((a,sc) => a + sc.items.length, 0);
      const secHead = document.createElement('div');
      secHead.style.cssText = 'display:flex;align-items:center;gap:12px;margin-bottom:16px;margin-top:28px;';
      secHead.innerHTML = `<span style="font-size:28px">${cat.icon}</span><div><div style="font-family:Syne,sans-serif;font-size:18px;font-weight:800;">${escHtml(cat.name)}</div><div style="font-size:11px;color:var(--text-muted)">Código ${cat.id} · ${itemCount} itens</div></div>`;
      main.appendChild(secHead);

      cat.subcats.forEach(sc => {
        const filtered = q ? sc.items.filter(item =>
          item.code.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.unit.toLowerCase().includes(q)
        ) : sc.items;
        if (filtered.length === 0) return;
        totalVisible += filtered.length;
        main.appendChild(buildSubcatEl(sc, filtered, q, true));
      });
    });

    if (q && totalVisible === 0) {
      main.innerHTML = `<div class="empty"><div class="e-icon">🔍</div><h2>Nenhum resultado</h2><p>Nenhum item encontrado para "<strong>${escHtml(q)}</strong>"</p></div>`;
    }

    if (q) document.getElementById('search-count').textContent = totalVisible + ' resultado' + (totalVisible !== 1 ? 's' : '');

  } else {
    const cat = DATA.find(c => c.id === currentCat);
    if (!cat) return;

    const itemCount = cat.subcats.reduce((a,sc) => a + sc.items.length, 0);
    let html = `<div class="cat-header"><div class="cat-header-icon">${cat.icon}</div><div class="cat-header-text"><h1>${escHtml(cat.name)}</h1><div class="meta">Código ${cat.id} · ${cat.subcats.length} subcategorias · ${itemCount} itens</div></div></div>`;
    main.innerHTML = html;

    let totalVisible = 0;
    cat.subcats.forEach(sc => {
      const filtered = q ? sc.items.filter(item =>
        item.code.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.unit.toLowerCase().includes(q)
      ) : sc.items;
      if (filtered.length === 0 && q) return;
      totalVisible += filtered.length;
      main.appendChild(buildSubcatEl(sc, filtered, q, false));
    });

    if (q && totalVisible === 0) {
      main.innerHTML += `<div class="empty"><div class="e-icon">🔍</div><h2>Nenhum resultado</h2><p>Nenhum item encontrado para "<strong>${escHtml(q)}</strong>"</p></div>`;
    }

    if (q) document.getElementById('search-count').textContent = totalVisible + ' resultado' + (totalVisible !== 1 ? 's' : '');
  }

  // Após renderizar, adiciona event listeners aos checkboxes
  attachCheckboxListeners();
}

// ==================== CONSTRÓI ELEMENTO DE SUBCATEGORIA ====================
function buildSubcatEl(sc, items, q, autoOpen) {
  const el = document.createElement('div');
  el.className = 'subcat' + (autoOpen || !q ? ' open' : ' open');

  const allItems = items.length === sc.items.length ? sc.items : items;

  el.innerHTML = `
    <div class="subcat-head" onclick="this.parentElement.classList.toggle('open')">
      <span class="subcat-code">${escHtml(sc.id)}</span>
      <span class="subcat-name">${highlight(sc.name, q)}</span>
      <span style="font-size:11px;color:var(--text-dim);flex-shrink:0;">${items.length}/${sc.items.length}</span>
      <span class="subcat-toggle">▾</span>
    </div>
    <table class="items-table">
      <thead>
        <tr>
          <th style="width:30px"><input type="checkbox" class="subcat-check-all" data-subcat-id="${sc.id}"></th>
          <th>Código</th>
          <th>Descrição</th>
          <th>Und.</th>
          <th>Qtde.</th>
          <th>Valor Unit.</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(item => `
        <tr class="${q ? 'highlight' : ''}">
          <td style="text-align:center"><input type="checkbox" class="item-checkbox" data-item-code="${escHtml(item.code)}" ${selectedItems.has(item.code) ? 'checked' : ''}></td>
          <td>${highlight(item.code, q)}</td>
          <td>${highlight(item.desc, q)}</td>
          <td>${highlight(item.unit || '—', q)}</td>
          <td style="text-align:right;color:var(--text-muted)">${item.qty !== 0 ? item.qty.toLocaleString('pt-BR', {maximumFractionDigits:2}) : '—'}</td>
          <td style="text-align:right" class="fmt-brl">${item.price ? fmtBRL(item.price) : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  return el;
}

// ==================== LISTENERS DOS CHECKBOXES ====================
function attachCheckboxListeners() {
  // Checkboxes de itens individuais
  document.querySelectorAll('.item-checkbox').forEach(cb => {
    cb.addEventListener('change', function(e) {
      const code = this.dataset.itemCode;
      if (this.checked) {
        selectedItems.add(code);
      } else {
        selectedItems.delete(code);
      }
      updateSelectedCount();
      // Atualiza estado do checkbox "selecionar todos" da subcategoria
      updateSubcatCheckAll(this.closest('.subcat'));
      e.stopPropagation();
    });
  });

  // Checkboxes "Selecionar todos" da subcategoria
  document.querySelectorAll('.subcat-check-all').forEach(cb => {
    cb.addEventListener('change', function(e) {
      const subcatId = this.dataset.subcatId;
      const subcatEl = this.closest('.subcat');
      const itemCheckboxes = subcatEl.querySelectorAll('.item-checkbox');
      const allChecked = this.checked;

      itemCheckboxes.forEach(icb => {
        icb.checked = allChecked;
        const code = icb.dataset.itemCode;
        if (allChecked) {
          selectedItems.add(code);
        } else {
          selectedItems.delete(code);
        }
      });
      updateSelectedCount();
      e.stopPropagation();
    });

    // Inicializa o estado do checkbox "todos"
    updateSubcatCheckAll(cb.closest('.subcat'));
  });
}

function updateSubcatCheckAll(subcatEl) {
  if (!subcatEl) return;
  const checkAll = subcatEl.querySelector('.subcat-check-all');
  const itemCbs = subcatEl.querySelectorAll('.item-checkbox');
  if (itemCbs.length === 0) return;
  const allChecked = Array.from(itemCbs).every(cb => cb.checked);
  checkAll.checked = allChecked;
  checkAll.indeterminate = !allChecked && Array.from(itemCbs).some(cb => cb.checked);
}

// ==================== EXPORTAÇÃO XLS ====================
function exportXLS() {
  const btn = document.getElementById('export-btn');
  btn.classList.add('loading');
  btn.textContent = 'Gerando...';

  if (window.XLSX) { doExport(btn); return; }

  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload = () => doExport(btn);
  script.onerror = () => {
    btn.classList.remove('loading');
    btn.innerHTML = '⚠ Erro';
    setTimeout(() => {
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Exportar XLS`;
    }, 2000);
  };
  document.head.appendChild(script);
}

function getSelectedItemsArray() {
  // Retorna array de itens selecionados, ou array vazio se nenhum
  const allItems = DATA.flatMap(cat =>
    cat.subcats.flatMap(sc => sc.items)
  );
  if (selectedItems.size > 0) {
    return allItems.filter(item => selectedItems.has(item.code));
  }
  return allItems; // se nada selecionado, exporta tudo
}

function doExport(btn) {
  const wb = XLSX.utils.book_new();
  const selected = getSelectedItemsArray();

  buildMemorialSheet(wb, selected);
  buildFullSheet(wb, selected);

  XLSX.writeFile(wb, 'Memorial_Calculo_22395E_VOLQUE.xlsx');

  btn.classList.remove('loading');
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Exportado!`;
  setTimeout(() => {
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Exportar XLS`;
  }, 3000);
}

// ── helpers ────────────────────────────────────────────────────────────────
function cellRef(r, c) { return XLSX.utils.encode_cell({r, c}); }

function setCell(ws, r, c, v, s) {
  const addr = cellRef(r, c);
  ws[addr] = { v, t: typeof v === 'number' ? 'n' : 's' };
  if (s) ws[addr].s = s;
}

function applyStyle(ws, r, c, s) {
  const addr = cellRef(r, c);
  if (ws[addr]) ws[addr].s = s; else ws[addr] = { v: '', t: 's', s };
}

function mergeRange(ws, r1, c1, r2, c2) {
  if (!ws['!merges']) ws['!merges'] = [];
  ws['!merges'].push({ s:{r:r1,c:c1}, e:{r:r2,c:c2} });
}

function extendRef(ws, maxR, maxC) {
  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxR,c:maxC}});
}

// ── colour palette ──────────────────────────────────────────────────────────
const C = {
  DARK_HEADER : 'FF1C2030',   // dark navy — planilha title band
  MID_HEADER  : 'FF252A3A',   // medium navy — column headers
  SUBCAT_BG   : 'FF2A3050',   // subcategory group row
  ALT_ROW     : 'FF181C28',   // alternating data row tint
  WHITE_ROW   : 'FF0D0F14',   // default data row bg
  ACCENT      : 'FFE8FF47',   // yellow accent
  TOTAL_BG    : 'FF1A2A10',   // total row bg
  TEXT_LIGHT  : 'FFE4E8F5',
  TEXT_DIM    : 'FF6B738F',
  TEXT_ACCENT : 'FFE8FF47',
  TEXT_GREEN  : 'FF47FFB3',
  TEXT_BLUE   : 'FF47B3FF',
};

function sFill(fgColor) { return { patternType:'solid', fgColor:{ rgb: fgColor.replace('FF','') } }; }

// base styles
const sTitle    = { font:{ bold:true, sz:12, color:{rgb:'E8FF47'}, name:'Arial' }, fill:sFill(C.DARK_HEADER), alignment:{horizontal:'left',  vertical:'center'} };
const sTitleSub = { font:{ bold:false, sz:9,  color:{rgb:'6B738F'}, name:'Arial' }, fill:sFill(C.DARK_HEADER), alignment:{horizontal:'left',  vertical:'center'} };
const sColHdr   = { font:{ bold:true, sz:9,  color:{rgb:'E4E8F5'}, name:'Arial' }, fill:sFill(C.MID_HEADER),  alignment:{horizontal:'center',vertical:'center', wrapText:true} };
const sColHdrR  = { ...sColHdr, alignment:{horizontal:'right', vertical:'center', wrapText:true} };
const sSubcat   = { font:{ bold:true, sz:9,  color:{rgb:'E8FF47'}, name:'Arial' }, fill:sFill(C.SUBCAT_BG),   alignment:{horizontal:'left',  vertical:'center'} };
const sSubcatN  = { font:{ bold:true, sz:9,  color:{rgb:'6B738F'}, name:'Arial' }, fill:sFill(C.SUBCAT_BG),   alignment:{horizontal:'center',vertical:'center'} };
const sCatBand  = { font:{ bold:true, sz:10, color:{rgb:'E8FF47'}, name:'Arial' }, fill:sFill('FF141720'),     alignment:{horizontal:'left',  vertical:'center'} };

function sData(alt, alignH) {
  return {
    font:{ sz:8, color:{rgb:'E4E8F5'}, name:'Arial' },
    fill:sFill(alt ? C.ALT_ROW : C.WHITE_ROW),
    alignment:{ horizontal: alignH||'left', vertical:'center', wrapText: alignH==='left' }
  };
}
function sDataNum(alt) {
  return { font:{sz:8, color:{rgb:'47B3FF'}, name:'Arial'}, fill:sFill(alt ? C.ALT_ROW : C.WHITE_ROW), alignment:{horizontal:'right', vertical:'center'}, numFmt:'#,##0.00' };
}
function sDataPrice(alt) {
  return { font:{sz:8, color:{rgb:'E8FF47'}, name:'Arial'}, fill:sFill(alt ? C.ALT_ROW : C.WHITE_ROW), alignment:{horizontal:'right', vertical:'center'}, numFmt:'"R$ "#,##0.00' };
}
function sTotal(c) {
  return { font:{bold:true, sz:9, color:{rgb: c||'47FFB3'}, name:'Arial'}, fill:sFill(C.TOTAL_BG), alignment:{horizontal:'right', vertical:'center'}, numFmt:'"R$ "#,##0.00' };
}

// ── Sheet 1: Memorial de Cálculo (adaptada para filtrar) ───────────────────
function buildMemorialSheet(wb, selectedItemsArr) {
  const ws = {};
  ws['!merges'] = []; // sem mesclagens

  // 10 colunas: A=ITEM, B=SERVIÇO, C=L, D=C, E=H, F=Q, G=FM, H=vazia, I=TOTAL, J=UND
  ws['!cols'] = [
    {wch:22}, // A - ITEM (código)
    {wch:62}, // B - SERVIÇO
    {wch:6},  // C - L (vazia)
    {wch:6},  // D - C (vazia)
    {wch:6},  // E - H (vazia)
    {wch:8},  // F - Q (vazia)
    {wch:10}, // G - FM (vazia)
    {wch:6},  // H - (vazia)
    {wch:18}, // I - TOTAL (vazia)
    {wch:8}   // J - UND
  ];
  ws['!rows'] = [];

  let r = 0;

  // ── Cabeçalho das colunas ──────────────────────────────────────────────
  const colHeaders = ['ITEM','SERVIÇO','L','C','H','Q','FM','','TOTAL','UND'];
  const colAligns  = ['left','left','center','center','center','center','center','center','right','center'];
  for (let c = 0; c < colHeaders.length; c++) {
    setCell(ws, r, c, colHeaders[c], {
      font: { bold: true, sz: 9, color: { rgb: 'E8FF47' }, name: 'Arial' },
      fill: sFill(C.MID_HEADER),
      alignment: { horizontal: colAligns[c], vertical: 'center', wrapText: true },
      border: { bottom: { style: 'thin', color: { rgb: 'E8FF47' } } }
    });
  }
  ws['!rows'][r] = { hpt: 20 };
  r++;

  // ── Mapeia itens selecionados para (categoria → subcategoria → itens) ───
  const catMap = new Map();
  for (const item of selectedItemsArr) {
    for (const cat of DATA) {
      for (const sc of cat.subcats) {
        const found = sc.items.find(it => it.code === item.code);
        if (found) {
          if (!catMap.has(cat.id)) {
            catMap.set(cat.id, { cat, subcats: new Map() });
          }
          const catEntry = catMap.get(cat.id);
          if (!catEntry.subcats.has(sc.id)) {
            catEntry.subcats.set(sc.id, { sc, items: [] });
          }
          catEntry.subcats.get(sc.id).items.push(found);
          break;
        }
      }
    }
  }

  // ── Para cada categoria (na ordem original) ────────────────────────────
  DATA.forEach(cat => {
    const catEntry = catMap.get(cat.id);
    if (!catEntry) return;

    // Linha da categoria
    setCell(ws, r, 0, cat.id, {
      font: { bold: true, sz: 10, color: { rgb: 'E8FF47' }, name: 'Arial' },
      fill: sFill('FF141720'),
      alignment: { horizontal: 'left', vertical: 'center' }
    });
    setCell(ws, r, 1, cat.name.toUpperCase(), {
      font: { bold: true, sz: 10, color: { rgb: 'E8FF47' }, name: 'Arial' },
      fill: sFill('FF141720'),
      alignment: { horizontal: 'left', vertical: 'center' }
    });
    // Colunas C a J com fundo escuro (vazias)
    for (let c = 2; c < 10; c++) applyStyle(ws, r, c, { fill: sFill('FF141720') });
    ws['!rows'][r] = { hpt: 18 };
    r++;

    cat.subcats.forEach(sc => {
      const scEntry = catEntry.subcats.get(sc.id);
      if (!scEntry || scEntry.items.length === 0) return;

      // Linha da subcategoria
      setCell(ws, r, 0, sc.id, sSubcatN);
      setCell(ws, r, 1, sc.name, sSubcat);
      // Colunas C a J com fundo de subcategoria (vazias)
      for (let c = 2; c < 10; c++) applyStyle(ws, r, c, { fill: sFill(C.SUBCAT_BG) });
      ws['!rows'][r] = { hpt: 16 };
      r++;

      // Itens da subcategoria
      scEntry.items.forEach((item, idx) => {
        const alt = idx % 2 === 1;

        // Coluna A: código do item
        setCell(ws, r, 0, item.code, sData(alt, 'left'));
        // Coluna B: descrição
        setCell(ws, r, 1, item.desc, sData(alt, 'left'));
        // Colunas C (L) a I (TOTAL) ficam em branco
        setCell(ws, r, 2, '', sData(alt, 'center')); // L
        setCell(ws, r, 3, '', sData(alt, 'center')); // C
        setCell(ws, r, 4, '', sData(alt, 'center')); // H
        setCell(ws, r, 5, '', sData(alt, 'center')); // Q
        setCell(ws, r, 6, '', sData(alt, 'center')); // FM
        setCell(ws, r, 7, '', sData(alt, 'center')); // vazio
        setCell(ws, r, 8, '', sData(alt, 'center')); // TOTAL (vazio)
        // Coluna J: unidade (preenchida)
        setCell(ws, r, 9, item.unit || '', sData(alt, 'center'));

        ws['!rows'][r] = { hpt: 14 };
        r++;
      });
    });
  });

  // ── Linha de total geral (vazia, só identificação) ─────────────────────
  setCell(ws, r, 1, 'TOTAL', {
    font: { bold: true, sz: 10, color: { rgb: 'E8FF47' }, name: 'Arial' },
    fill: sFill('FF0D1A06'),
    alignment: { horizontal: 'left', vertical: 'center' }
  });
  // As demais células ficam em branco
  for (let c = 1; c < 10; c++) applyStyle(ws, r, c, { fill: sFill('FF0D1A06') });
  ws['!rows'][r] = { hpt: 26 };

  extendRef(ws, r, 9);
  XLSX.utils.book_append_sheet(wb, ws, 'Memorial de Cálculo');
}
// ── Sheet 2: Todos os Itens (filtrada) ────────────────────────────────────
function buildFullSheet(wb, selectedItemsArr) {
  const ws = {};
  const headers = ['Categoria','Cód. Categoria','Subcategoria','Cód. Subcat.','Código Item','Descrição','Unidade','Quantidade','Valor Unit. (R$)','Total (R$)'];
  const rows = [headers];

  // Para cada item selecionado, encontra a categoria e subcategoria
  for (const item of selectedItemsArr) {
    for (const cat of DATA) {
      for (const sc of cat.subcats) {
        const found = sc.items.find(it => it.code === item.code);
        if (found) {
          rows.push([
            cat.name, cat.id, sc.name, sc.id,
            found.code, found.desc, found.unit||'',
            found.qty||0, found.price||0,
            (found.qty||0)*(found.price||0)
          ]);
          break;
        }
      }
    }
  }

  const wsData = XLSX.utils.aoa_to_sheet(rows);
  wsData['!cols'] = [{wch:35},{wch:8},{wch:35},{wch:10},{wch:20},{wch:70},{wch:8},{wch:10},{wch:16},{wch:16}];

  const range = XLSX.utils.decode_range(wsData['!ref']);
  for (let c = range.s.c; c <= range.e.c; c++) {
    const addr = XLSX.utils.encode_cell({r:0,c});
    if (wsData[addr]) wsData[addr].s = { font:{bold:true,sz:9,name:'Arial'}, fill:sFill(C.MID_HEADER), font:{bold:true,color:{rgb:'E8FF47'}} };
  }
  XLSX.utils.book_append_sheet(wb, wsData, 'Todos os Itens');
}

function previewXLS() {
  const selected = getSelectedItemsArray(); // mesma lógica da exportação
  const modal = document.getElementById('previewModal');
  const container = document.getElementById('previewTableContainer');
  const table = document.getElementById('previewTable');

  // Gera a tabela HTML
  let html = `<thead><tr>
    <th style="min-width:120px;">ITEM</th>

    <th style="min-width:50px;">FM</th>
    <th style="min-width:60px;">TOTAL</th>
    <th style="min-width:60px;">UND</th>
  </tr></thead><tbody>`;

  let totalItems = 0;
  // Mapeia itens selecionados para (categoria → subcategoria → itens)
  const catMap = new Map();
  for (const item of selected) {
    for (const cat of DATA) {
      for (const sc of cat.subcats) {
        const found = sc.items.find(it => it.code === item.code);
        if (found) {
          if (!catMap.has(cat.id)) {
            catMap.set(cat.id, { cat, subcats: new Map() });
          }
          const catEntry = catMap.get(cat.id);
          if (!catEntry.subcats.has(sc.id)) {
            catEntry.subcats.set(sc.id, { sc, items: [] });
          }
          catEntry.subcats.get(sc.id).items.push(found);
          break;
        }
      }
    }
  }

  DATA.forEach(cat => {
    const catEntry = catMap.get(cat.id);
    if (!catEntry) return;
    // Linha da categoria
    html += `<tr class="cat-row"><td>${escHtml(cat.id)}</td><td>${escHtml(cat.name.toUpperCase())}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;

    catEntry.subcats.forEach((scEntry, scId) => {
      if (scEntry.items.length === 0) return;
      // Linha da subcategoria
      html += `<tr class="subcat-row"><td>${escHtml(scId)}</td><td>${escHtml(scEntry.sc.name)}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;

      scEntry.items.forEach(item => {
        totalItems++;
        html += `<tr>
          <td>${escHtml(item.code)}</td>
          <td>${escHtml(item.desc)}</td>
          <td></td><td></td><td></td><td></td><td></td><td></td>
          <td>${escHtml(item.unit || '')}</td>
        </tr>`;
      });
    });
  });

  // Linha TOTAL
  html += `<tr style="background:#0D1A06; font-weight:bold; color:var(--accent);">
    <td></td><td>TOTAL</td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
  </tr>`;

  html += '</tbody>';
  table.innerHTML = html;
  document.getElementById('previewCount').textContent = totalItems;

  modal.style.display = 'flex';
}
